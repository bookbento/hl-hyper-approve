# DEV server 43.210.109.106 — /etc/nginx/sites-available/hlememo-dev
#
# The host's nginx owns 80/443 for the other tenants; hyper is published on :8088 and
# everything goes to the hyper-dev-web container (Caddy), which serves the SPA and
# proxies /api to the api container. Apply with:
#   sudo cp docker/nginx-hlememo-dev.conf /etc/nginx/sites-available/hlememo-dev
#   sudo ln -sf /etc/nginx/sites-available/hlememo-dev /etc/nginx/sites-enabled/hlememo-dev
#   sudo nginx -t && sudo systemctl reload nginx      # reload only — never restart
# Rollback: sudo rm /etc/nginx/sites-enabled/hlememo-dev && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
