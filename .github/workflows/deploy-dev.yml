name: Deploy dev

# DEV server 43.210.109.106 — shared with ~11 other sites. This workflow only touches
# ~/hyper-dev and the hyper-dev-* containers; it never restarts nginx, Postgres or Docker.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/checks.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:dev
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: docker-compose.dev.yml
          target: ~/hyper-dev

      - name: Pull, migrate, up
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
          EMAIL_TOKEN_SECRET: ${{ secrets.DEV_EMAIL_TOKEN_SECRET }}
          PUBLIC_URL: ${{ vars.DEV_PUBLIC_URL }}
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          # ⚠️ Only the names listed here reach the script — add new ones here too.
          envs: GHCR_USER,GHCR_TOKEN,REPO,GIT_SHA,DATABASE_URL,JWT_SECRET,EMAIL_TOKEN_SECRET,PUBLIC_URL
          script: |
            set -eu
            cd ~/hyper-dev

            # Our own docker config dir, so logging in to GHCR here never replaces the
            # credentials other tenants on this box (foodreview) rely on.
            export DOCKER_CONFIG="$HOME/hyper-dev/.docker"
            mkdir -p "$DOCKER_CONFIG"

            # .env is rebuilt from GitHub secrets on every deploy: a new variable shows up
            # as a failed deploy here, not as a container that won't boot later.
            need() { [ -n "$2" ] || { echo "Missing GitHub secret/var: $1"; exit 1; }; }
            need DEV_DATABASE_URL "$DATABASE_URL"
            need DEV_JWT_SECRET "$JWT_SECRET"
            need DEV_EMAIL_TOKEN_SECRET "$EMAIL_TOKEN_SECRET"
            URL="${PUBLIC_URL:-http://43.210.109.106:8088}"
            IMG="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
            umask 077
            cat > .env <<EOF
            IMAGE_API=$IMG-api
            IMAGE_WEB=$IMG-web
            TAG=$GIT_SHA
            DATABASE_URL=$DATABASE_URL
            JWT_SECRET=$JWT_SECRET
            EMAIL_TOKEN_SECRET=$EMAIL_TOKEN_SECRET
            APP_BASE_URL=$URL
            FRONTEND_URL=$URL
            CORS_ORIGIN=$URL
            EOF

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            C="docker compose -f docker-compose.dev.yml"
            $C pull
            $C run --rm api sh /app/packages/database/scripts/migrate-deploy.sh
            $C up -d --remove-orphans

            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8089/api/health >/dev/null; then echo "✅ healthy"; break; fi
              [ "$i" = 30 ] && { $C ps; $C logs --tail 80 api; exit 1; }
              sleep 3
            done

            docker logout ghcr.io
            # Drop our older image tags (any version can be pulled back from GHCR).
            # Never a global `docker image prune` on a shared box.
            for app in api web; do
              docker image ls "$IMG-$app" --format '{{.Tag}} {{.ID}}' \
                | awk -v t="$GIT_SHA" '$1 != t && $1 != "dev" {print $2}' \
                | xargs -r docker image rm || true
            done
