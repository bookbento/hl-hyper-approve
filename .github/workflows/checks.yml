name: Checks

# Runs on every PR / push, and is reused by the deploy workflows before building images.
on:
  pull_request:
  push:
    branches-ignore: [develop, production]
  workflow_call:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # @hl/database postinstall runs prisma generate + tsc (no DB needed)
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: API typecheck
        run: pnpm --filter apps/api exec tsc --noEmit -p .

      - name: API unit tests
        run: pnpm test:api

      # The frontend has pre-existing tsc errors (~42), so CI gates on a production
      # build, which is what actually ships. Tighten to tsc once they're fixed.
      - name: Frontend build
        run: pnpm --filter my-react-app build

      - name: Frontend unit tests
        run: pnpm --filter my-react-app test:run
