# DRAFT — not in .github/workflows, so GitHub never runs it.
#
# Prod 43.208.169.222 still runs the old Express app and is live for the whole company.
# Move this file into .github/workflows/ only after the cutover has been agreed and
# done by hand once (install Docker, pg_hba for the docker bridge, stop pm2 + nginx,
# migrate, up -d — see the deployer agent notes). Until then: do not enable.

name: Deploy prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy prod" to confirm'
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ inputs.confirm }}" = "deploy prod" ] || { echo "Not confirmed"; exit 1; }'

  test:
    needs: guard
    uses: ./.github/workflows/checks.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production   # add required reviewers on this environment in GitHub
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/hyper
      - uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          EMAIL_TOKEN_SECRET: ${{ secrets.PROD_EMAIL_TOKEN_SECRET }}
          SMTP_HOST: ${{ secrets.PROD_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.PROD_SMTP_PORT }}
          SMTP_USER: ${{ secrets.PROD_SMTP_USER }}
          SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
          SMTP_FROM: ${{ secrets.PROD_SMTP_FROM }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,REPO,GIT_SHA,DATABASE_URL,JWT_SECRET,EMAIL_TOKEN_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM
          script: |
            set -eu
            cd ~/hyper
            for v in DATABASE_URL JWT_SECRET EMAIL_TOKEN_SECRET SMTP_HOST SMTP_FROM; do
              eval "[ -n \"\${$v:-}\" ]" || { echo "Missing secret PROD_$v"; exit 1; }
            done
            IMG="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
            URL=https://e-approval.hylifeconnect.com
            umask 077
            cat > .env <<EOF
            DOMAIN=e-approval.hylifeconnect.com
            IMAGE_API=$IMG-api
            IMAGE_WEB=$IMG-web
            TAG=$GIT_SHA
            DATABASE_URL=$DATABASE_URL
            JWT_SECRET=$JWT_SECRET
            EMAIL_TOKEN_SECRET=$EMAIL_TOKEN_SECRET
            APP_BASE_URL=$URL
            FRONTEND_URL=$URL
            CORS_ORIGIN=$URL
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=${SMTP_PORT:-587}
            SMTP_USER=${SMTP_USER:-}
            SMTP_PASS=${SMTP_PASS:-}
            SMTP_FROM=$SMTP_FROM
            EOF
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            C="docker compose -f docker-compose.prod.yml"
            $C pull
            $C run --rm api sh /app/packages/database/scripts/migrate-deploy.sh
            $C up -d --remove-orphans
            for i in $(seq 1 30); do
              curl -fsS https://e-approval.hylifeconnect.com/api/health >/dev/null && { echo "✅ healthy"; break; }
              [ "$i" = 30 ] && { $C ps; $C logs --tail 80 api; exit 1; }
              sleep 3
            done
            docker logout ghcr.io
            docker image prune -f
